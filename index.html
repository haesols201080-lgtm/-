<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>빌더즈 팩토리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* layout: full-bleed 3D world; HUD cards pinned to corners; crosshair centered; modal panel floats over the world */
:root{
  --bg:#0c1120;
  --glass:rgba(17,23,43,.84);
  --panel:#161d36;
  --panel2:#212a4a;
  --line:#36426b;
  --ink:#f3ebd6;
  --muted:#9ba4c0;
  --accent:#f39a35;   /* factory orange */
  --gold:#ffd66b;     /* banner gold */
  --heart:#ff7aa8;    /* gratitude hearts */
  --good:#6fd08c;
  --bad:#ef6464;
  --display:'Jua','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;word-break:keep-all;overflow-wrap:break-word;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
button{font-family:var(--display);font-size:15px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.pri{background:var(--accent);color:#2a1606;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.hud{position:fixed;z-index:5;pointer-events:none}
.card{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#tl{z-index:9;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;width:min(250px,46vw);display:grid;gap:6px}
#tr{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:min(310px,50vw);display:grid;gap:6px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.lbl{font-family:var(--display);letter-spacing:.02em;color:var(--muted);font-size:13px}
.big{font-family:var(--display);font-size:17px}
.num{font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:6px;background:#0a0e1a;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#e34b4b,#ff8a6a);width:100%}
.bar.heart>i{background:linear-gradient(90deg,#e0507e,var(--heart))}
.bar.prog>i{background:linear-gradient(90deg,var(--accent),var(--gold))}
.btnrow{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.btnrow button{font-size:13px;padding:4px 9px}
#obj{pointer-events:auto;cursor:pointer}
#obj .t{font-family:var(--display);font-size:16px;color:var(--gold);text-wrap:balance;margin-top:2px}
#obj .h{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:4px}
#pow.low{color:var(--bad)}
#lvup{color:var(--heart)}
#cross{left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
#cross::before,#cross::after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px #000}
#cross::before{left:10px;top:3px;width:2px;height:16px}
#cross::after{top:10px;left:3px;width:16px;height:2px}
#tinfo{left:50%;top:calc(50% + 22px);transform:translateX(-50%);font-family:var(--display);font-size:14px;color:var(--ink);text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap}
#toasts{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;width:min(420px,80vw)}
.toast{background:var(--glass);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:6px 12px;font-family:var(--display);font-size:15px;animation:tin .25s ease-out}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}.toast.gold{border-left-color:var(--gold);color:var(--gold)}.toast.heart{border-left-color:var(--heart);color:var(--heart)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#insp{top:28%;left:50%;transform:translateX(-50%);text-align:center;background:radial-gradient(closest-side,rgba(255,214,107,.28),transparent);padding:24px 48px}
#insp .ib{font-family:var(--display);font-size:30px;color:var(--gold);text-shadow:0 2px 0 #7a4a10,0 0 18px rgba(255,214,107,.7)}
#insp div+div{font-family:var(--display);font-size:16px;margin-top:4px;text-shadow:0 1px 3px #000}
#ctitle{inset:0;display:grid;place-content:center;text-align:center;background:linear-gradient(180deg,transparent 30%,rgba(5,8,18,.75) 45%,rgba(5,8,18,.75) 58%,transparent 72%);animation:fadein .6s}
#ctitle .c1{font-family:var(--display);font-size:20px;color:var(--accent);letter-spacing:.3em}
#ctitle .c2{font-family:var(--display);font-size:44px;color:var(--gold);text-shadow:0 3px 0 #6b3d0c;margin-top:6px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#raid{top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translateX(-50%);background:rgba(120,20,30,.85);border:1px solid #ff8080;border-radius:10px;padding:6px 16px;font-family:var(--display);font-size:16px}
#dialog{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:min(580px,calc(100vw - 32px));pointer-events:auto;cursor:pointer;border:2px solid #e9e3cf;border-radius:10px;background:#101731f0;padding:12px 16px}
#dialog .who{font-family:var(--display);color:var(--gold);font-size:16px;margin-bottom:4px}
#dialog .txt{font-size:15px;line-height:1.6}
#hotbar{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:4px;pointer-events:auto}
.slot{width:50px;height:50px;border-radius:9px;background:var(--glass);border:2px solid var(--line);position:relative;display:grid;place-items:center;cursor:pointer}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,214,107,.25)}
.slot img{width:76%;height:76%}
.slot .k{position:absolute;left:4px;top:1px;font-size:10px;color:var(--muted);font-family:var(--display)}
.slot .c{position:absolute;right:4px;bottom:1px;font-size:12px;font-family:var(--display);font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.slot.zero img{opacity:.35}
#selname{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 66px);font-family:var(--display);font-size:14px;text-shadow:0 1px 3px #000}
#lock{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(5,8,18,.35);cursor:pointer}
#lock .card{text-align:center;padding:18px 26px;display:grid;gap:8px;max-width:min(440px,calc(100vw - 32px))}
#lock .big{font-size:24px;color:var(--gold)}
#lock .sub{color:var(--muted);font-size:13px;line-height:1.6}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,18,.55);display:grid;place-items:center;padding:16px}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(900px,100%);max-height:min(86vh,100%);overflow:auto;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#panel h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--gold)}
#panel h3{font-family:var(--display);font-weight:400;font-size:17px;margin:16px 0 8px;color:var(--accent);letter-spacing:.02em}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--panel);padding:4px 0 10px;z-index:2}
.sub{color:var(--muted);font-size:13px;line-height:1.5}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
@media (max-width:720px){.cols{grid-template-columns:minmax(0,1fr)}}
.crow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:9px;background:var(--panel2);margin-bottom:5px}
.crow.lock{opacity:.5}
.crow img{width:36px;height:36px}
.crow .nm{font-family:var(--display);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;background:#0f1428;border-radius:6px;padding:1px 6px 1px 2px;font-variant-numeric:tabular-nums}
.chip img{width:18px;height:18px}
.chip.no{color:var(--bad)}.chip.ok{color:var(--good)}
.cbtn{display:flex;gap:4px}
.cbtn button{padding:4px 8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.cell{background:var(--panel2);border-radius:9px;padding:4px;text-align:center;border:1px solid transparent;cursor:pointer}
.cell:hover{border-color:var(--accent)}
.cell img{width:36px;height:36px;display:block;margin:0 auto}
.cell .cn{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cc{font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums}
.cell.inhot{border-color:var(--gold)}
.grid>.sub{grid-column:1/-1}
.gh{font-family:var(--display);color:var(--muted);font-size:13px;margin:10px 0 5px;letter-spacing:.04em}
.recs{display:flex;flex-wrap:wrap;gap:6px}
.recs button.on{background:var(--accent);color:#2a1606;border-color:var(--accent)}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:10px;margin:10px 0}
.flow .arrow{font-family:var(--display);color:var(--accent);font-size:20px}
.stat{display:inline-block;font-family:var(--display);font-size:13px;border-radius:999px;padding:2px 10px;background:#0f1428;border:1px solid var(--line)}
.stat.on{color:var(--good);border-color:var(--good)}.stat.off{color:var(--muted)}.stat.low{color:var(--bad);border-color:var(--bad)}
.need{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:6px}
.need img{width:28px;height:28px}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px;line-height:1.5}
.keys b{font-family:var(--display);font-weight:400;color:var(--gold)}
.lvbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--panel2);border-radius:12px;padding:12px}
.lvbox .lv{font-family:var(--display);font-size:40px;color:var(--gold);line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:#0f1428}
/* touch */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#joy{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);width:124px;height:124px;border-radius:50%;background:rgba(17,23,43,.45);border:2px solid rgba(255,255,255,.18);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:39px;top:39px;width:46px;height:46px;border-radius:50%;background:rgba(243,154,53,.75)}
#tbtns{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);display:grid;grid-template-columns:repeat(2,auto);gap:8px;pointer-events:auto}
#tbtns button{width:66px;height:52px;border-radius:14px;font-size:15px;padding:0;white-space:nowrap;background:rgba(17,23,43,.8)}
#tbtns button.on{background:var(--accent);color:#2a1606}
#tJump{grid-column:span 2;width:100%!important}
@media (max-width:640px){
  .slot{width:min(37px,calc((100vw - 44px)/9));height:min(37px,calc((100vw - 44px)/9));border-radius:7px}
  #hotbar{gap:3px}
  #obj .h{display:none}#obj.open .h{display:block}
  #tl .card,#tr .card{padding:7px 9px}
  .big{font-size:15px}
  #dialog{bottom:calc(env(safe-area-inset-bottom,0px) + 250px)}
  #dialog .txt{font-size:14px}
  #selname{bottom:calc(env(safe-area-inset-bottom,0px) + 54px)}
  #ctitle .c2{font-size:32px}
}
/* story scenes */
#story{position:fixed;inset:0;z-index:15;cursor:pointer}
#story::before,#story::after{content:"";position:absolute;left:0;right:0;height:9vh;background:#000;z-index:1}
#story::before{top:0}#story::after{bottom:0}
#story.narr{background:radial-gradient(ellipse at center,rgba(0,0,0,.1),rgba(0,0,0,.6))}
#sbox{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:calc(9vh + 18px);width:min(720px,calc(100vw - 32px));background:rgba(8,12,28,.92);border:2px solid #e9e3cf;border-radius:10px;padding:14px 18px 24px}
#story.narr #sbox{background:transparent;border:none;text-align:center;bottom:auto;top:50%;transform:translate(-50%,-50%)}
#story.narr #sTxt{font-family:var(--display);font-size:23px;text-shadow:0 2px 6px #000,0 0 18px rgba(0,0,0,.85);min-height:0}
#sWho{font-family:var(--display);font-size:17px;margin-bottom:6px;color:var(--gold)}
#sTxt{font-size:16px;line-height:1.75;min-height:3.5em;text-wrap:pretty}
#snext{position:absolute;right:16px;bottom:6px;color:var(--gold);font-size:14px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#sSkip{position:absolute;z-index:3;right:16px;top:calc(9vh + 12px);font-size:13px;padding:4px 12px;background:rgba(17,23,43,.75)}
body.cine .hud,body.cine #touch,body.cine #lock{visibility:hidden}
body.cine #ctitle{visibility:visible}
@media (max-width:640px){#story.narr #sTxt{font-size:18px}#sTxt{font-size:15px}}
/* title screen */
#title{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:minmax(0,500px) 1fr;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 56px calc(env(safe-area-inset-bottom,0px) + 40px)}
.tvig{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(8,12,28,.9) 0%,rgba(8,12,28,.62) 36%,rgba(8,12,28,0) 68%),linear-gradient(0deg,rgba(8,12,28,.55),transparent 28%)}
.tbox{position:relative;display:grid;gap:20px;width:100%;max-width:440px;animation:tup .8s ease-out}
@keyframes tup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{display:flex;align-items:center;gap:16px}
.logo img{width:86px;height:86px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.logo .l1,.logo .l2{font-family:var(--display);line-height:.98;letter-spacing:.03em}
.logo .l1{font-size:66px;color:var(--gold);text-shadow:0 3px 0 #b8741a,0 6px 0 #7a4a10,0 14px 26px rgba(0,0,0,.6)}
.logo .l2{font-size:66px;color:var(--accent);text-shadow:0 3px 0 #a3561a,0 6px 0 #5a2a08,0 14px 26px rgba(0,0,0,.6)}
.logo .en{font-family:var(--display);font-size:13px;letter-spacing:.42em;color:#cfe6ff;opacity:.8;margin-top:8px}
.tsub{font-family:var(--display);font-size:18px;color:#cfe6ff;letter-spacing:.1em;display:flex;align-items:center;gap:10px}
.tsub::before{content:"";width:30px;height:2px;background:var(--gold)}
.tmenu{display:grid;gap:4px;background:rgba(8,12,28,.84);border:2px solid #e9e3cf;border-radius:12px;padding:10px}
.tmenu button,.tpanel .tb{all:unset;box-sizing:border-box;display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:6px;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;font-family:var(--display);font-size:21px;color:var(--ink)}
.tmenu button::before,.tpanel .tb::before{content:"▶";grid-row:span 2;font-size:13px;color:var(--gold);opacity:0;transition:opacity .12s}
.tmenu button.sel::before,.tpanel .tb.sel::before{opacity:1}
.tmenu button.sel,.tpanel .tb.sel{background:rgba(255,214,107,.1)}
.tmenu button small{grid-column:2;font-family:var(--body);font-size:12.5px;color:var(--muted);margin-top:2px}
.tmenu button:disabled,.tpanel .tb:disabled{opacity:.38;cursor:default}
.tpanel .tb small{grid-column:2;font-family:var(--body);font-size:12.5px;color:var(--muted);margin-top:2px}
.tmenu button:focus-visible,.tpanel .tb:focus-visible{outline:2px solid var(--gold)}
.tpanel{background:rgba(8,12,28,.9);border:2px solid #e9e3cf;border-radius:12px;padding:14px 16px;display:grid;gap:12px;max-height:min(60vh,520px);overflow:auto}
.tpanel h3{font-family:var(--display);font-weight:400;font-size:19px;color:var(--gold);margin:0}
.tpanel .tb{font-size:17px;padding:7px 10px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--display);font-size:16px}
.setrow .tog{all:unset;cursor:pointer;min-width:84px;text-align:center;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#0f1428;font-family:var(--display);font-size:14px}
.setrow .tog.on{background:var(--accent);color:#2a1606;border-color:var(--accent)}
.setrow .tog:focus-visible{outline:2px solid var(--gold)}
.setrow input[type=range]{width:min(180px,45vw);accent-color:var(--accent)}
.tfoot{position:absolute;left:56px;right:56px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.tfoot b{font-family:var(--display);font-weight:400;color:var(--ink)}
body.titlemode .hud,body.titlemode #touch,body.titlemode #lock{visibility:hidden}
@media (max-width:720px){
  #title{grid-template-columns:minmax(0,1fr);align-items:end;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 56px)}
  .tvig{background:linear-gradient(0deg,rgba(8,12,28,.94) 0%,rgba(8,12,28,.7) 52%,rgba(8,12,28,.05) 100%)}
  .tbox{max-width:none;gap:14px}
  .logo .l1,.logo .l2{font-size:46px}.logo img{width:60px;height:60px}
  .tmenu button{font-size:19px;padding:8px 10px}
  .tfoot{left:16px;right:16px;font-size:11px}.tfoot span:first-child{display:none}
  #title{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
}
@media (prefers-reduced-motion:reduce){.tbox{animation:none}}
@media (prefers-reduced-motion:reduce){.toast,#ctitle{animation:none}}
</style>
</head>
<body>
<div id="game"></div>

<div id="tl" class="hud">
  <div class="card">
    <div class="row"><span class="lbl">체력</span><span id="hpT" class="num lbl">100/100</span></div>
    <div class="bar"><i id="hpB"></i></div>
    <div class="row" style="margin-top:6px"><span id="clock" class="big num">1일차 06:00</span><span id="phase" class="lbl">낮</span></div>
    <div class="row" style="margin-top:2px"><span id="town" class="lbl">깃발 없음</span><span id="heartT" class="lbl num"></span></div>
    <div class="bar heart"><i id="heartB" style="width:0"></i></div>
    <div class="row"><span id="pow" class="lbl num">전력 0/0 MW</span><span id="lvup" class="lbl" hidden>레벨 업 가능!</span></div>
  </div>
  <div class="btnrow">
    <button id="bBag">가방 E</button><button id="bSave">저장</button><button id="bSnd">소리 끔</button><button id="bHelp">도움말</button><button id="bMenu">메인 화면</button>
  </div>
</div>

<div id="tr" class="hud">
  <div id="obj" class="card">
    <div class="row"><span class="lbl" id="chap">제1장</span><span class="lbl" id="ms">마일스톤 0/3</span></div>
    <div class="t" id="objT"></div>
    <div class="h" id="objH"></div>
  </div>
</div>

<div id="cross" class="hud"></div>
<div id="tinfo" class="hud"></div>
<div id="toasts" class="hud"></div>
<div id="insp" class="hud" hidden><div class="ib">번뜩였다!</div><div id="inspT"></div></div>
<div id="raid" class="hud" hidden></div>
<div id="ctitle" class="hud" hidden><div class="c1" id="ct1"></div><div class="c2" id="ct2"></div></div>
<div id="dialog" class="hud" hidden><div class="who" id="dWho"></div><div class="txt" id="dTxt"></div></div>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,sc,s){const fx=x/sc,fy=y/sc,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy;const a=hash2(ix,iy,s),b=hash2(ix+1,iy,s),c=hash2(ix,iy+1,s),d=hash2(ix+1,iy+1,s);const sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}
function fbm(x,z,s){return vnoise(x,z,26,s)*.55+vnoise(x,z,11,s+1)*.3+vnoise(x,z,5,s+2)*.15}
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;

// ============================================================ factory
function machAccept(e,item,cap){
  let r=RECIPES[e.rec];
  if(e.t==='smelter'&&(!r||!r.in[item])&&!e.busy&&!Object.values(e.inb).some(v=>v>0)){const nr=ENTS.smelter.recipes.find(k=>RECIPES[k].in[item]);if(nr){e.rec=nr;r=RECIPES[nr]}}
  if(!r||!r.in[item]||!unlockedMs(r.ms))return false;
  if((e.inb[item]||0)>=r.in[item]*(cap||4))return false;
  e.inb[item]=(e.inb[item]||0)+1;return true;
}
function chestTotal(e){let s=0;for(const k in e.st)s+=e.st[k];return s}
function tryInsert(x,y,z,item,d){
  if(!inW(x,y,z))return false;let i=I(x,y,z),e=ents.get(i);
  if(!e){if(vox[i]!==A||y<1)return false;i=I(x,y-1,z);e=ents.get(i);if(!e||!ENTS[e.t].belt)return false}
  const back=(d+2)%4;
  switch(e.t){
    case 'conveyor':case 'conveyor2':case 'ramp':if(e.item||e.dir===back)return false;e.item=item;e.prog=e.dir===d?0:.5;e.mv=tick;return true;
    case 'splitter':if(e.buf||e.dir!==d)return false;e.buf=item;return true;
    case 'smelter':case 'maker':case 'assembler':if(e.dir===back)return false;return machAccept(e,item);
    case 'burner':case 'coalgen':{const E=ENTS[e.t];if(item!==E.fuel||e.fuel>=50)return false;e.fuel++;return true}
    case 'chest':if(e.dir===back||chestTotal(e)>=999)return false;e.st[item]=(e.st[item]||0)+1;return true;
    case 'banner':S.hub[item]=(S.hub[item]||0)+1;S.stats.hubIn[item]=(S.stats.hubIn[item]||0)+1;S.stats.hubTotal++;if(S.stats.hubTotal%80===0)addHearts(2,null,'공장이 잘 돌아가서 기뻐요!');return true;
    case 'elevator':{const need=ELEV_NEED[item];if(!need||(e.st[item]||0)>=need||e.launch!=null)return false;e.st[item]=(e.st[item]||0)+1;return true}
  }
  return false;
}
function canWork(e){
  const E=ENTS[e.t];if(E.node)return(e.out||0)<10;
  const r=RECIPES[e.rec];if(!r||!unlockedMs(r.ms))return false;if(e.busy)return true;
  if(e.outItem&&e.outItem!==r.out[0]&&e.out>0)return false;if((e.out||0)+r.out[1]>20)return false;
  for(const k in r.in)if((e.inb[k]||0)<r.in[k])return false;return true;
}
const roomTypeAt=i=>{const r=roomOf.get(i);return r?r.type:null};
function factoryTick(dt){
  tick++;let demand=0,cap=0;
  for(const i of M){const e=ents.get(i);if(!e)continue;const E=ENTS[e.t];
    if(E.power){e.want=canWork(e);if(e.want)demand+=E.power}
    if(E.gen&&(e.burn>0||e.fuel>0))cap+=E.gen*(roomTypeAt(i)==='power'?1.25:1)}
  cap=Math.round(cap);
  const ratio=demand?Math.min(1,cap/demand):1,load=cap?Math.min(1,demand/cap):0,bst=boost();
  power={cap,demand,ratio};
  for(const i of M){
    const e=ents.get(i);if(!e)continue;const E=ENTS[e.t],x=i%WX,r_=(i-x)/WX,z=r_%WZ,y=(r_-z)/WZ;
    if(E.gen){if(load>0&&e.burn<=0&&e.fuel>0){e.fuel--;e.burn=E.ft}if(e.burn>0&&load>0)e.burn-=dt*load;e.on=load>0&&(e.burn>0||e.fuel>0);continue}
    if(E.belt){
      if(e.item&&e.mv!==tick){e.prog=Math.min(1,e.prog+dt*E.speed);
        if(e.prog>=1&&tryInsert(x+DX[e.dir],y+(E.ramp?1:0),z+DZ[e.dir],e.item,e.dir)){e.item=null;e.prog=0}}
      continue}
    if(e.t==='splitter'){if(e.buf){const ds=[(e.dir+3)%4,e.dir,(e.dir+1)%4];for(let k=0;k<3;k++){const dd=ds[(e.rr+k)%3];if(tryInsert(x+DX[dd],y,z+DZ[dd],e.buf,dd)){e.buf=null;e.rr=(e.rr+k+1)%3;break}}}continue}
    if(e.t==='chest'){e.cd=(e.cd||0)-dt;if(e.cd<=0){e.cd=.25;for(const k in e.st){if(e.st[k]>0&&tryInsert(x+DX[e.dir],y,z+DZ[e.dir],k,e.dir)){e.st[k]--;if(!e.st[k])delete e.st[k];break}}}continue}
    e.act=false;
    if(e.want&&ratio>0){
      e.act=true;const rb=roomTypeAt(i)==='factory'?1.25:1;
      if(E.node){e.prog+=dt*ratio*bst*rb/E.mt;if(e.prog>=1){e.prog=0;e.outItem=e.ore;e.out=(e.out||0)+1}}
      else{const r=RECIPES[e.rec];if(!e.busy){for(const k in r.in)e.inb[k]-=r.in[k];e.busy=1}
        e.prog+=dt*ratio*bst*rb/r.t;if(e.prog>=1){e.prog=0;e.busy=0;e.outItem=r.out[0];e.out=(e.out||0)+r.out[1]}}
    }

  }

    if(p>=.5&&!S.kingDone&&!raid){startRaid('king');playStory('boss')}
    if(p>=1&&ee.launch==null&&!raid){ee.launch=0;S.time=.585;title('발사!','등불이 하늘로 올라가요');sfx('level');setTimeout(()=>playStory('ending',()=>{S.time=.05;S.won=true;showWin()}),2200)}}}
}
function elevProgress(){if(!S.elev)return 0;const e=ents.get(I(S.elev.x,S.elev.y,S.elev.z));if(!e)return 0;let a=0,b=0;for(const k in ELEV_NEED){a+=Math.min(e.st[k]||0,ELEV_NEED[k]);b+=ELEV_NEED[k]}return a/b}

// ============================================================ rooms
function isWallCell(x,y,z){const id=getB(x,y,z);if(id===ENT){const e=ents.get(I(x,y,z));return!!(e&&e.t==='door')}if(id===ENT_TOP)return true;return BL[id].solid===1}
function computeRooms(){
  roomsDirty=false;const old=rooms;rooms=[];roomOf=new Map();if(!S.banner)return;
  const r=baseR(),bx0=S.banner.x,bz0=S.banner.z,seen=new Set();
  for(const[i,e]of ents){
    if(!ENTS[e.t].light||e.t==='banner'||seen.has(i))continue;
    const[x0,y0,z0]=XYZ(i);if(Math.abs(x0-bx0)>r||Math.abs(z0-bz0)>r)continue;
    const vis=new Set([i]),q=[i],tiles=[i];let ok=true,door=false;
    while(q.length&&ok){
      const c=q.pop(),cx=c%WX,cz=((c-cx)/WX)%WZ;
      for(let d=0;d<4;d++){
        const nx=cx+DX[d],nz=cz+DZ[d];
        if(Math.abs(nx-bx0)>r||Math.abs(nz-bz0)>r){ok=false;break}
        const ni=I(nx,y0,nz);
        if(isWallCell(nx,y0,nz)){if(!isWallCell(nx,y0+1,nz)){ok=false;break}const ne=ents.get(ni);if(ne&&ne.t==='door')door=true;continue}
        if(vis.has(ni))continue;vis.add(ni);tiles.push(ni);q.push(ni);if(tiles.length>110){ok=false;break}
      }
    }
    for(const t of tiles)seen.add(t);
    if(!ok||!door||tiles.length<4)continue;
    const c={};for(const k in ENTS)c[k]=0;let mn=Infinity;for(const t of tiles){const e2=ents.get(t);if(e2)c[e2.t]++;if(t<mn)mn=t}
    const type=ROOMTYPES.find(rt=>rt.ok(c)).id,room={tiles,type,key:mn+':'+tiles.length+':'+type,c};
    rooms.push(room);for(const t of tiles)roomOf.set(t,room);
  }
  for(const rm of rooms){
    if(S.roomKeys.includes(rm.key))continue;
    S.roomKeys.push(rm.key);if(S.roomKeys.length>400)S.roomKeys.shift();
    if(old.some(o=>o.tiles[0]===rm.tiles[0]&&o.type===rm.type))continue;
    const first=!S.roomSeen[rm.type];S.roomSeen[rm.type]=1;
    addHearts(first?15:6,null,`「${RT[rm.type].n}」이(가) 생겨서 기뻐요!`);
    title(first?'방 레시피 완성!':'방 완성!',`「${RT[rm.type].n}」`,1800);sfx('level');
  }
  assignBeds();
}
function assignBeds(){
  const beds=[];for(const rm of rooms)if(rm.type==='bedroom')for(const t of rm.tiles){const e=ents.get(t);if(e&&e.t==='bed')beds.push(t)}
  S.villagers.forEach((v,k)=>{v.bed=k<beds.length?beds[k]:null;if(v.bed==null)v.sleeping=false});
}

let lampG=null,farLand=null;
function lampLit(){if(S.lamp)return true;if(!S.ruin)return false;const tx=S.ruin.x-2,tz=S.ruin.z-2,ty=S.ruin.y+8;
  for(const[i,e]of ents){if(e.t!=='torch'&&e.t!=='bonfire')continue;const[x,y,z]=XYZ(i);if(y>=ty&&Math.abs(x-tx)<=1&&Math.abs(z-tz)<=1){S.lamp=true;buildLighthouse();sfx('level');return true}}return false}
function farLandTex(seed){
  const W=1024,Hh=200,c=document.createElement('canvas');c.width=W;c.height=Hh;const g=c.getContext('2d');
  const ridge=(x,sc,o)=>{let v=0,a=1,n=0;for(let k=0;k<4;k++){const r=vnoise(x*(1<<k)/sc,o,1,seed+k*7);v+=(1-Math.abs(r*2-1))*a;n+=a;a*=.5}return v/n};
  const layers=[[100,62,[168,180,196],.5,200,11],[128,46,[136,150,172],.68,130,23],[152,26,[116,130,154],.82,70,37]];
  for(const[base,amp,col,al,sc,o]of layers){
    // ridge line, sharpened near the middle so the land looks like a distant island range
    g.beginPath();g.moveTo(0,Hh);
    for(let x=0;x<=W;x+=2){const mid=1-Math.pow(Math.abs(x/W-.5)*2,2.2);g.lineTo(x,base+ (1-mid)*60-ridge(x,sc,o)*amp*mid)}
    g.lineTo(W,Hh);g.closePath();
    const gr=g.createLinearGradient(0,base-amp,0,Hh);gr.addColorStop(0,`rgba(${col},${al})`);gr.addColorStop(.7,`rgba(${col},${al*.75})`);gr.addColorStop(1,'rgba(214,220,226,0)');
    g.fillStyle=gr;g.fill()}
  // soften the sides into the fog

  fd.addColorStop(0,'rgba(0,0,0,0)');fd.addColorStop(.15,'rgba(0,0,0,1)');fd.addColorStop(.85,'rgba(0,0,0,1)');fd.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=fd;g.fillRect(0,0,W,Hh);
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;return t;
}
function buildLighthouse(){

  const c2=cone.clone();c2.position.x=-23;beam.add(c2);lampG.add(beam);lampG.userData.beam=beam;scene.add(lampG);

// ============================================================ villager requests
const reqOf=v=>(REQS[v.name]||[])[v.req];
function reqBaseFor(r){return r.k==='deliver'?(S.stats.hubIn[r.item]||0):r.k==='block'?(S.stats.placed[r.b]||0):r.k==='kill'?S.stats.kills:r.k==='bp'?S.stats.bps:0}
function reqProgress(v){const r=reqOf(v);if(!r)return null;switch(r.k){
  case 'give':return[Math.min(cnt(r.item),r.n),r.n];
  case 'ent':return[Math.min(countEnt(r.ent),r.n),r.n];
  case 'deliver':return[clamp((S.stats.hubIn[r.item]||0)-v.reqBase,0,r.n),r.n];
  case 'block':return[clamp((S.stats.placed[r.b]||0)-v.reqBase,0,r.n),r.n];
  case 'kill':return[clamp(S.stats.kills-v.reqBase,0,r.n),r.n];
  case 'room':return[rooms.some(x=>x.type===r.room)?1:0,1];
  case 'power':return[Math.min(power.cap,r.n),r.n];

function talk(v){

    if(a>=b){if(r.k==='give')S.inv[r.item]-=r.n;hotDirty=true;v.req++;v.reqState='wait';v.reqT=45;v.hearts+=r.h;collectHearts(v);say(v.name,'고마워요, 빌더님! 정말 기뻐요!');sfx('level');return}

  if(v.guide){const o=OBJ[S.obj];say(v.name,o?`${o.t}! ${o.h}`:'모든 목표를 이뤘어요! 이제 마음껏 마을과 공장을 키워 봐요.');return}

// ============================================================ blueprints
function placeBlueprint(k,ox,oy,oz,d){

  const f=[DX[d],DZ[d]],r=[DX[(d+1)%4],DZ[(d+1)%4]];
  const cells=BPS[k].gen().map(c=>({x:ox+r[0]*c.x-f[0]*c.z,y:oy+c.y,z:oz+r[1]*c.x-f[1]*c.z,b:c.b,e:c.e,d:c.e?(c.d+d)%4:0}));
  if(cells.some(c=>!inW(c.x,c.y,c.z))){toast('설계도가 세계 밖으로 나가요','bad');return false}
  S.bp={k,cells};bpDirty=true;sfx('place');
  toast(`설계도 「${BPS[k].n}」를 놓았어요. 마을 보관함에 재료를 넣으면 주민들이 지어요.`,'gold');
  return true;
}
function bpState(c){const id=getB(c.x,c.y,c.z);
  if(c.b!=null){if(id===c.b)return'ok';if(id===A||id===WATER)return'todo';return'blocked'}
  const e=ents.get(I(c.x,c.y,c.z));if(e&&e.t===c.e)return'ok';if(id===A||id===WATER)return'todo';return'blocked'}
const bpItem=c=>c.b!=null?blockItem[c.b]:c.e;
function bpNeeds(){const need={};if(!S.bp)return need;for(const c of S.bp.cells)if(bpState(c)!=='ok'){const k=bpItem(c);need[k]=(need[k]||0)+1}return need}
function townChests(){const out=[];for(const[i,e]of ents){if(e.t!=='chest')continue;const[x,,z]=XYZ(i);if(inBase(x,z))out.push(e)}return out}
function chestCount(item){let n=0;for(const e of townChests())n+=e.st[item]||0;return n}
function takeFromChests(item){for(const e of townChests())if(e.st[item]>0){e.st[item]--;if(!e.st[item])delete e.st[item];return true}return false}
function putInChest(item,n){const cs=townChests();if(!cs.length)return;const e=cs[0];e.st[item]=(e.st[item]||0)+n}
function updateBlueprint(){
  bpDirty=false;ghostInst.count=0;if(!S.bp)return;let n=0,done=true;
  for(const c of S.bp.cells){const st=bpState(c);c.st=st;if(st==='ok')continue;done=false;if(n>=600)continue;
    _v.set(c.x+.5,c.y+.5,c.z+.5);_s.set(1,1,1);if(c.e){_s.set(.6,c.e==='door'?1.9:.6,.6);_v.y=c.y+(c.e==='door'?.95:.3)}
    _m4.compose(_v,_q.identity(),_s);ghostInst.setMatrixAt(n,_m4);ghostInst.setColorAt(n,_c.setHex(st==='blocked'?0xff5050:c.e?0xffd66b:0x5aa8ff));n++}
  ghostInst.count=n;ghostInst.instanceMatrix.needsUpdate=true;if(ghostInst.instanceColor)ghostInst.instanceColor.needsUpdate=true;
  if(done){const nm=BPS[S.bp.k].n;S.bp=null;S.stats.bps++;title('설계도 완성!',`「${nm}」`,2200);sfx('level');addHearts(20,null,'모두 함께 지었어요!');roomsDirty=true}
}
function pickBpCell(v){
  let best=null,bd=1e9;const taken=new Set(S.villagers.filter(o=>o!==v&&o.task).map(o=>o.task.c));
  for(const c of S.bp.cells){
    if(c.st==='ok'||taken.has(c)||(c.skip&&c.skip>T))continue;
    if(c.st==='blocked'){const id=getB(c.x,c.y,c.z);if(id===ENT||id===ENT_TOP||id===BEDROCK||BL[id].node)continue}
    else if(chestCount(bpItem(c))<=0)continue;
    const d=Math.hypot(c.x+.5-v.x,c.z+.5-v.z)+Math.abs(c.y-v.y)*.5;if(d<bd){bd=d;best=c}
  }

}
function villagerBuild(v,c){
  const st=bpState(c);
  if(st==='blocked'){const id=getB(c.x,c.y,c.z);setB(c.x,c.y,c.z,A);burst(c.x,c.y,c.z,partColor(id),8);const d=BL[id].drop;if(d)putInChest(d,1);sfx('break');return}
  if(st!=='todo')return;const k=bpItem(c);

  else{if(ENTS[c.e].tall&&getB(c.x,c.y+1,c.z)!==A){putInChest(k,1);return}addEnt(I(c.x,c.y,c.z),newEnt(c.e,c.d,c.x,c.y,c.z))}

// ============================================================ villager navigation
function walkable(x,y,z){if(!inW(x,y,z)||y+1>=WY)return false;if(solidAt(x,y,z)||solidAt(x,y+1,z))return false;return solidAt(x,y-1,z)||getB(x,y-1,z)===WATER}
function findPath(sx,sy,sz,goal,maxN){
  const prev=new Map(),q=[sx,sy,sz];let h=0;prev.set(I(sx,sy,sz),-1);
  while(h<q.length&&prev.size<maxN){
    const x=q[h],y=q[h+1],z=q[h+2];h+=3;
    if(goal(x,y,z)){const path=[];let k=I(x,y,z);while(k!==-1){path.push(XYZ(k));k=prev.get(k)}path.reverse();path.shift();return path}
    for(let d=0;d<4;d++){const nx=x+DX[d],nz=z+DZ[d];
      for(const dy of[0,1,-1,-2,-3]){const ny=y+dy;
        if(dy===1&&solidAt(x,y+2,z))continue;
        if(dy<0&&(solidAt(nx,y,nz)||solidAt(nx,y+1,nz)))break;
        if(walkable(nx,ny,nz)){const k=I(nx,ny,nz);if(!prev.has(k)){prev.set(k,I(x,y,z));q.push(nx,ny,nz)}break}}}
  }
  return null;
}
function navTo(v,key,goal){if(v.navKey!==key){v.navKey=key;v.navTries=(v.navTries||0)+1;v.path=findPath(Math.floor(v.x),Math.floor(v.y+.01),Math.floor(v.z),goal,2600);v.navFail=!v.path}return v.path}
function nextWaypoint(v){while(v.path&&v.path.length){const[x,y,z]=v.path[0];if(Math.hypot(x+.5-v.x,z+.5-v.z)<.3&&Math.abs(y-v.y)<1.3)v.path.shift();else return[x+.5,z+.5]}return null}

// ============================================================ villagers update
function updVillagers(dt){
  const night=isNight();
  for(const v of S.villagers){
    if(!v._m)attachVillagerMesh(v);
    if(v.faint>0){v.faint-=dt;if(v.faint<=0){v.faint=0;v.hp=30}physStep(v,0,0,dt,false);continue}
    v.atk-=dt;
    if(v.reqState==='wait'&&S.banner){v.reqT-=dt;if(v.reqT<=0&&reqOf(v))v.reqState='avail'}
    if(v.hearts>0&&Math.hypot(P.x-v.x,P.z-v.z)<2.4&&Math.abs(P.y-v.y)<3)collectHearts(v);
    let foe=null,fd=8;if(!v.guide)for(const s of slimes){const d=Math.hypot(s.x-v.x,s.z-v.z);if(d<fd){fd=d;foe=s}}
    let wp=null,sp=1.7,stop=false;
    const hasBed=v.bed!=null&&ents.get(v.bed)&&ents.get(v.bed).t==='bed';
    if(foe){v.sleeping=false;v.navKey=null;sp=2.7;if(fd<1.2+SLT[foe.type].sc*.4){stop=true;if(v.atk<=0){v.atk=1;hitSlime(foe,6,v)}}else wp=[foe.x,foe.z];v.face=Math.atan2(-(foe.x-v.x),-(foe.z-v.z))}
    else if(v.sleeping){if(!night||!hasBed){v.sleeping=false}else{const[bx,by,bz]=XYZ(v.bed);v.x=bx+.5;v.z=bz+.5;v.y=by+.3;v.vy=0;continue}}
    else if(night&&hasBed){const[bx,by,bz]=XYZ(v.bed);
      if(Math.hypot(bx+.5-v.x,bz+.5-v.z)<.7&&Math.abs(by-v.y)<1.2){v.sleeping=true;v.slept=true;continue}
      navTo(v,'bed'+v.bed,(x,y,z)=>x===bx&&y===by&&z===bz);wp=nextWaypoint(v)||(v.navFail?null:[bx+.5,bz+.5])}
    else if(S.bp&&!night&&!raid){
      if(v.task&&bpState(v.task.c)==='ok')v.task=null;
      if(!v.task){const c=pickBpCell(v);if(c){v.task={c,t:0};v.navTries=0}}
      if(v.task){const c=v.task.c,cdist=Math.max(Math.abs(c.x-Math.floor(v.x)),Math.abs(c.z-Math.floor(v.z)));
        const self=c.b!=null&&v.x+v.w>c.x&&v.x-v.w<c.x+1&&v.z+v.w>c.z&&v.z-v.w<c.z+1&&v.y<c.y+1&&v.y+v.h>c.y;
        if(cdist<=2&&cdist>0&&!self&&Math.abs(c.y-v.y)<2.5){stop=true;v.task.t+=dt;v.face=Math.atan2(-(c.x+.5-v.x),-(c.z+.5-v.z));if(v.task.t>.7){villagerBuild(v,c);v.task=null;v.navKey=null}}
        else{navTo(v,'t'+I(c.x,c.y,c.z),(x,y,z)=>{const d=Math.hypot(x-c.x,z-c.z);return d<=2.2&&d>=1&&Math.abs(y-c.y)<=2});
          if(v.navFail||v.navTries>4){c.skip=T+30;v.task=null;v.navKey=null}else wp=nextWaypoint(v)||[Math.floor(v.x)+.5,Math.floor(v.z)+.5]}}
    }
    if(!foe&&!v.task&&!v.sleeping&&!(night&&hasBed)){
      if(!v.path||!v.path.length){v.wait-=dt;stop=true;
        if(v.wait<=0){const cx=S.banner?S.banner.x:48,cz=S.banner?S.banner.z:50,rr=v.guide?3:(night?3:Math.max(3,baseR()-2));
          const tx=clamp(Math.round(cx+(Math.random()*2-1)*rr),1,WX-2),tz=clamp(Math.round(cz+(Math.random()*2-1)*rr),1,WZ-2);
          navTo(v,'w'+tx+'_'+tz+'_'+T,(x,y,z)=>Math.abs(x-tx)<=1&&Math.abs(z-tz)<=1);v.wait=1.5+Math.random()*4}}

    }
    let wx=0,wz=0;
    if(!stop&&wp){const dx=wp[0]-v.x,dz=wp[1]-v.z,d=Math.hypot(dx,dz);if(d>.05){wx=dx/d*sp;wz=dz/d*sp;v.face=Math.atan2(-wx,-wz)}}
    const ox=v.x,oz=v.z;physStep(v,wx,wz,dt,true);
    v.moving=Math.hypot(v.x-ox,v.z-oz)>dt*.3;if(v.moving)v.walk+=dt*9;
    if(wx||wz){if(!v.moving){v.stuck+=dt;if(v.stuck>1.5){v.stuck=0;v.navKey=null;if(!v.task&&!(night&&hasBed))v.path=null}}else v.stuck=Math.max(0,v.stuck-dt)}
    if(v.y<-5){v.y=surfaceY(Math.floor(v.x),Math.floor(v.z));v.vy=0}
  }
}

    case 'rec':if(en&&!en.busy&&en.rec!==b.dataset.r){for(const k in en.inb)if(en.inb[k]>0)give(k,en.inb[k]);en.inb={};en.rec=b.dataset.r}else if(en&&en.busy)toast('만드는 중이에요. 잠시 후에 바꿔 주세요.','bad');refreshMachine(true);break;
    case 'minsert':{if(!en)break;let n=0;const recs=en.rec?[en.rec]:ENTS[en.t].recipes;for(const rk of recs){const r=RECIPES[rk];for(const k in r.in)while(cnt(k)>0&&machAccept(en,k,12)){S.inv[k]--;n++}if(n)break}
      hotDirty=true;toast(n?`재료 ${n}개를 넣었어요`:'넣을 재료가 가방에 없어요',n?'good':'bad');refreshMachine(true);break}
    case 'mtake':if(en&&en.out>0){give(en.outItem,en.out);en.out=0;if(!ENTS[en.t].node)en.outItem=null}refreshMachine(true);break;
    case 'fuel':{const f=ENTS[en.t].fuel,n=Math.min(cnt(f),50-en.fuel);if(n>0){S.inv[f]-=n;en.fuel+=n;hotDirty=true}else toast(cnt(f)?'연료가 가득 찼어요':`${nameOf(f)}이(가) 없어요`,'bad');refreshMachine(true);break}
    case 'unfuel':if(en.fuel>0){give(ENTS[en.t].fuel,en.fuel);en.fuel=0}refreshMachine(true);break;
    case 'ctake':{const id=b.dataset.id;if(en.st[id]){give(id,en.st[id]);delete en.st[id]}refreshMachine(true);break}
    case 'ctakeall':for(const k in en.st)give(k,en.st[k]);en.st={};refreshMachine(true);break;
    case 'cputblocks':case 'cputall':for(const k in S.inv){const it=IT[k];if(S.inv[k]<=0||it.tool||it.bp||k==='banner')continue;const isB=it.block!=null||!!it.ent;if((a==='cputblocks')!==isB)continue;en.st[k]=(en.st[k]||0)+S.inv[k];S.inv[k]=0}hotDirty=true;refreshMachine(true);break;
    case 'lvup':levelUp();refreshMachine(true);break;
    case 'bpfill':{const nd=bpNeeds(),cs=townChests();let n=0;if(cs.length)for(const k in nd){const want=Math.max(0,nd[k]-chestCount(k)),d=Math.min(want,cnt(k));if(d>0){S.inv[k]-=d;cs[0].st[k]=(cs[0].st[k]||0)+d;n+=d}}hotDirty=true;toast(n?`재료 ${n}개를 보관함에 넣었어요`:'가방에 필요한 재료가 없어요',n?'good':'bad');refreshMachine(true);break}
    case 'bpcancel':S.bp=null;bpDirty=true;for(const v of S.villagers)v.task=null;toast('설계도를 거뒀어요');refreshMachine(true);break;
    case 'hubdep':{const m=MS[S.ms];let n=0;for(const k in m.need){const need=Math.max(0,m.need[k]-(S.hub[k]||0)),d=Math.min(need,cnt(k));if(d>0){S.inv[k]-=d;S.hub[k]=(S.hub[k]||0)+d;n+=d}}hotDirty=true;toast(n?`${n}개를 깃발에 넣었어요`:'가방에 필요한 부품이 없어요',n?'good':'bad');refreshMachine(true);break}
    case 'hubms':completeMilestone();refreshMachine(true);break;
    case 'hubtake':{const id=b.dataset.id,n=Math.min(50,S.hub[id]||0);if(n){S.hub[id]-=n;give(id,n)}refreshMachine(true);break}
    case 'elevdep':{let n=0;for(const k in ELEV_NEED){const d=Math.min(cnt(k),ELEV_NEED[k]-(en.st[k]||0));if(d>0){S.inv[k]-=d;en.st[k]=(en.st[k]||0)+d;n+=d}}hotDirty=true;toast(n?`${n}개를 넣었어요`:'가방에 필요한 부품이 없어요',n?'good':'bad');refreshMachine(true);break}
    case 'replay':closeModal();playStory('prologue');break;
  }
});
function eatBerry(){if(cnt('berry')<=0){toast('베리가 없어요','bad');return}if(S.hp>=100){toast('기운이 넘쳐요');return}S.inv.berry--;S.hp=Math.min(100,S.hp+15);popText(P.x,P.y+2.2,P.z,'+15','#7dff9a');hotDirty=true;sfx('heart')}

function rle(a){const out=[];let cur=a[0],n=0;for(let i=0;i<a.length;i++){if(a[i]===cur)n++;else{out.push(cur.toString(36)+'.'+n.toString(36));cur=a[i];n=1}}out.push(cur.toString(36)+'.'+n.toString(36));return out.join(',')}
function unrle(s,a){let p=0;for(const tok of s.split(',')){const[x,y]=tok.split('.'),v=parseInt(x,36),n=parseInt(y,36);a.fill(v,p,p+n);p+=n}}
let curSlot=1;
const slotKey=n=>SAVE_KEY+'-slot'+n;
function migrateLegacy(){try{const old=localStorage.getItem(SAVE_KEY);if(old&&!localStorage.getItem(slotKey(1))){localStorage.setItem(slotKey(1),old);const m=localStorage.getItem(SAVE_KEY+'-meta');if(m)localStorage.setItem(slotKey(1)+'-meta',m)}if(old){localStorage.removeItem(SAVE_KEY);localStorage.removeItem(SAVE_KEY+'-meta')}}catch(e){}}
function slotMeta(n){try{const m=JSON.parse(localStorage.getItem(slotKey(n)+'-meta')||'null');if(m)return m;if(localStorage.getItem(slotKey(n)))return{day:'?',lv:'?',obj:0,ts:0}}catch(e){}return null}
function latestSlot(){let best=0,bt=-1;for(let n=1;n<=3;n++){const m=slotMeta(n);if(m&&(m.ts||0)>bt){bt=m.ts||0;best=n}}return best}
function deleteSlot(n){try{localStorage.removeItem(slotKey(n));localStorage.removeItem(slotKey(n)+'-meta')}catch(e){}}
function save(quiet){
  if(!S||S.bg)return;
  const SAVE_KEY=slotKey(curSlot);
  try{localStorage.setItem(SAVE_KEY+'-meta',JSON.stringify({day:S.day,lv:S.lv,obj:S.obj,won:S.won,ts:Date.now()}));const data={v:3,S,vox:rle(vox),ents:[...ents],P:[P.x,P.y,P.z],cam:[camYaw,camPitch,camDist]};
    localStorage.setItem(SAVE_KEY,JSON.stringify(data,(k,v)=>k[0]==='_'||k==='task'?undefined:v));if(!quiet)toast(`슬롯 ${curSlot}에 저장했어요`,'good')}
  catch(e){if(!quiet)toast('이 환경에서는 저장할 수 없어요','bad')}
}
function load(n){
  try{const raw=localStorage.getItem(slotKey(n));if(!raw)return false;const d=JSON.parse(raw);if(d.v!==3)return false;
    unrle(d.vox,vox);ents.clear();for(const[i,e]of d.ents)ents.set(i,e);S=d.S;[P.x,P.y,P.z]=d.P;[camYaw,camPitch,camDist]=d.cam;
    const RENAME={'리아':'세라','브리타':'카이','루루':'세라','피피':'카이','모모':'마르코','돌쇠':'바르톨','가람':'테오','나래':'시엘','보리':'오스카'};
    for(const v of S.villagers){if(RENAME[v.name])v.name=RENAME[v.name];v.task=null;v.sleeping=false;v.wait=Math.min(v.wait||0,2)}if(!S.v2){if(S.obj>=6)S.obj++;S.v2=1}if(!S.v3){if(S.obj>=1)S.obj++;S.v3=1}if(S.obj>7)S.lamp=true;S.downed=false;curSlot=n;afterLoad();return true}
  catch(e){console.warn(e);return false}
}
function afterLoad(){
  for(const g of entMesh.values())scene.remove(g);entMesh.clear();
  for(const[i,e]of ents)createEntMesh(i,e);
  rebuildM();rebuildAllChunks();buildBaseLine();buildLighthouse();
  updLighting.snap=1;

  for(const v of S.villagers){v._m=null;attachVillagerMesh(v)}

  roomsDirty=true;bpDirty=true;hotDirty=true;rooms=[];
  if(!playerModel){playerModel=makeChar(LOOKS.player,true);scene.add(playerModel)}
  const o=OBJ[S.obj];raidAt=o&&o.t.includes('습격')?T+20:0;
}
function newGame(story){
  const seed=(Math.random()*1e9)|0;
  S={seed,inv:{},hot:Array(9).fill(null),sel:0,rot:0,time:.04,day:1,hp:100,lv:1,hearts:0,ms:0,hub:{},obj:0,v2:1,v3:1,lamp:false,downed:false,banner:null,elev:null,seen:{},roomKeys:[],roomSeen:{},villagers:[],bp:null,won:false,kingDone:false,
     stats:{got:{},hubIn:{},crafted:{},placed:{},kills:0,raids:0,bps:0,hubTotal:0}};
  const ruin=genWorld(seed);ents.clear();
  const bc=ruin.beach;P.x=bc.x;P.z=bc.z;P.y=bc.y;P.vy=0;P.face=Math.PI*.5;camYaw=Math.PI;camPitch=-.28;
  S.inv.berry=3;S.seen.berry=1;if(story===false)give('banner',1);else S.downed=true;

  const px=Math.floor(bc.x),pz=Math.floor(bc.z),gy=surfaceY(px,pz);let sx=px,sz=pz-1;
  for(const[dx,dz]of[[0,-1],[1,-1],[-1,-1],[0,1],[0,-2],[1,0],[-1,0]]){const x=px+dx,z=pz+dz;
    if(surfaceY(x,z)===gy&&getB(x,gy-1,z)!==WATER&&getB(x,gy,z)===A&&getB(x,gy+1,z)===A){sx=x;sz=z;break}}
  const lv=mkVillager(LULU,sx+.5,sz+.5);lv.wait=8;lv.face=Math.atan2(-(bc.x-lv.x),-(bc.z-lv.z));S.villagers.push(lv);

}

  if(v==='confirm'){const m=slotMeta(tSlot);pn.innerHTML=`<h3>슬롯 ${tSlot}에 새 게임</h3><p class="sub">슬롯 ${tSlot}의 마을(${m?slotDesc(m):''})이 지워지고, 새로운 땅에서 프롤로그부터 시작해요.</p>
    <button class="tb" data-t="newyes"><span>지우고 새로 시작</span></button><button class="tb" data-t="new"><span>취소</span></button>`}
  if(v==='delconfirm'){const m=slotMeta(tSlot);pn.innerHTML=`<h3>슬롯 ${tSlot} 지우기</h3><p class="sub">${m?slotDesc(m):''} 마을이 영영 사라져요. 정말 지울까요?</p>
    <button class="tb" data-t="delyes"><span>지우기</span></button><button class="tb" data-t="continue"><span>취소</span></button>`}
  const sl=$('sSens');if(sl)sl.addEventListener('input',()=>{SET.sens=+sl.value;saveSettings()});
  const items=titleItems();setTSel(items.findIndex(b=>!b.disabled));
}
const titleItems=()=>[...(tView==='menu'?$('tmenu').querySelectorAll('button'):$('tpanel').querySelectorAll('.tb'))];
let tSel=0;
function setTSel(k){const items=titleItems();if(!items.length)return;tSel=(k+items.length)%items.length;items.forEach((b,j)=>b.classList.toggle('sel',j===tSel))}
function titleMove(d){const items=titleItems();for(let n=0;n<items.length;n++){const k=(tSel+d*(n+1)+items.length*4)%items.length;if(!items[k].disabled){setTSel(k);sfx('pop');return}}}
function titleAct(t){
  ensureAudio();sfx('place');
  if(t==='continue'){titleView('load');return}
  if(t==='new'){titleView('new');return}
  if(t==='del'){titleView('del');return}
  if(t==='slot'){const n=tSlot;
    if(tView==='load'){if(n!==curSlot||S.bg){if(!load(n)){toast('불러오지 못했어요','bad');return}}hideTitle();if(!isTouch&&!cursorMode)requestLock();const o=OBJ[S.obj];setTimeout(()=>toast(`슬롯 ${n} · ${o?'이어서: '+o.t:'마을과 공장을 마음껏 키워 보세요'}`,'gold'),500);return}
    if(tView==='new'){if(slotMeta(n)){titleView('confirm');return}curSlot=n;hideTitle();newGame(true);return}
    if(tView==='del'){titleView('delconfirm');return}}
  if(t==='newyes'){deleteSlot(tSlot);curSlot=tSlot;hideTitle();newGame(true);return}
  if(t==='delyes'){deleteSlot(tSlot);if(tSlot===curSlot&&!S.bg){const ls=latestSlot();if(!(ls&&load(ls)))newGame(false)}toast(`슬롯 ${tSlot}을 지웠어요`);titleView(latestSlot()?'load':'menu');return}
  if(t==='howto'||t==='settings'){titleView(t);return}
  if(t==='back'){titleView('menu');return}
}
$('title').addEventListener('click',e=>{
  const s=e.target.closest('[data-s]');if(s){ensureAudio();if(s.dataset.s==='sound')SET.sound=!SET.sound;else SET.quality=SET.quality==='high'?'low':'high';saveSettings();applySettings();titleView('settings');sfx('pop');return}
  const b=e.target.closest('[data-t]');if(!b||b.disabled)return;if(b.dataset.n)tSlot=+b.dataset.n;titleAct(b.dataset.t);
});
$('title').addEventListener('mousemove',e=>{const b=e.target.closest('.tmenu button,.tpanel .tb');if(!b||b.disabled)return;const k=titleItems().indexOf(b);if(k>=0&&k!==tSel)setTSel(k)});
function titleKey(e){
  if(e.code==='ArrowDown'||e.code==='KeyS'){titleMove(1);return}
  if(e.code==='ArrowUp'||e.code==='KeyW'){titleMove(-1);return}
  if(e.code==='Enter'||e.code==='Space'){const b=titleItems()[tSel];if(b&&!b.disabled)b.click();return}
  if(e.code==='Escape'&&tView!=='menu')titleView(tView==='confirm'?'new':tView==='delconfirm'||tView==='del'?'load':'menu');
}
function titleCamera(){
  const c=S.banner?{x:S.banner.x+.5,y:S.banner.y+2,z:S.banner.z+.5}:S.ruin?{x:S.ruin.x+.5,y:S.ruin.y+3,z:S.ruin.z+.5}:{x:48,y:14,z:48};
  const a=T*.045,r=17,px_=c.x+Math.cos(a)*r,pz_=c.z+Math.sin(a)*r;
  let hy=c.y+10;for(let k=0;k<=1;k+=.2){const sx=lerp(px_,c.x,k),sz=lerp(pz_,c.z,k);hy=Math.max(hy,topAt(Math.floor(sx),Math.floor(sz))+3-k*4)}
  camera.position.set(px_,hy,pz_);
  const fx=c.x-px_,fz=c.z-pz_,l=Math.hypot(fx,fz)||1,wide=innerWidth>720;
  _hv.set(c.x-(-fz/l)*(wide?6:0),c.y+(wide?0:-3),c.z-(fx/l)*(wide?6:0));camera.lookAt(_hv);playerModel.visible=true;
}

// ============================================================ player update
let mine=null;
function updatePlayer(dt){
  let fw=0,st=0;
  if(!modal.kind&&!S.downed){if(keys.KeyW)fw++;if(keys.KeyS)fw--;if(keys.KeyD)st++;if(keys.KeyA)st--;fw-=joyV.y;st+=joyV.x;
    if(keys.ArrowLeft)camYaw+=dt*2.2;if(keys.ArrowRight)camYaw-=dt*2.2;if(keys.ArrowUp)camPitch=clamp(camPitch+dt*1.5,-1.4,1.15);if(keys.ArrowDown)camPitch=clamp(camPitch-dt*1.5,-1.4,1.15)}
  const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
  let wx=fx*fw+rx*st,wz=fz*fw+rz*st;const l=Math.hypot(wx,wz);if(l>1){wx/=l;wz/=l}
  let bvx=0,bvz=0;const fe=ents.get(I(clamp(Math.floor(P.x),0,WX-1),clamp(Math.floor(P.y+.05),0,WY-1),clamp(Math.floor(P.z),0,WZ-1)));
  if(fe&&ENTS[fe.t].belt&&!ENTS[fe.t].ramp){bvx=DX[fe.dir]*ENTS[fe.t].speed*.9;bvz=DZ[fe.dir]*ENTS[fe.t].speed*.9}
  const r=physStep(P,wx*4.8+bvx,wz*4.8+bvz,dt,true);
  if((keys.Space||jumpBtn)&&!modal.kind&&!S.downed&&(P.onGround||r.inWater))P.vy=r.inWater?4.5:8.6;
  P.moving=l>.1;if(P.moving){P.face=Math.atan2(-wx,-wz);P.walk+=dt*10}
  if(P.y<-8){P.y=surfaceY(Math.floor(P.x),Math.floor(P.z));P.vy=0}
  P.hurt-=dt;P.atk-=dt;P.swing-=dt;P.regen-=dt;if(P.regen<=0&&S.hp<100){S.hp=Math.min(100,S.hp+1);P.regen=isNight()?5:2}
  const touchMine=tch&&!tch.moved&&tMode==='break'&&performance.now()-tch.t0>220;
  if(tch&&!tch.moved){aimX=tch.x/innerWidth*2-1;aimY=-(tch.y/innerHeight)*2+1}else if(isTouch||locked){aimX=0;aimY=0}
  if(leftPressed){leftPressed=false;if(!modal.kind&&P.atk<=0&&(aim.mon||!aim.hit||coneSlime())){attack();mine=null}}
  if((leftHeld||touchMine)&&!modal.kind){
    if(aim.mon||coneSlime()&&P.atk<=0){if(P.atk<=0)attack();mine=null}
    else if(aim.hit){const h=aim.hit,i=I(h.x,h.y,h.z);if(!mine||mine.i!==i)mine={i,p:0,x:h.x,y:h.y,z:h.z};
      const id=getB(h.x,h.y,h.z);if(id===BEDROCK){mine=null}else{mine.p+=dt/mineTime(id);if(P.swing<=0)P.swing=.3;if(mine.p>=1){breakAt(h.x,h.y,h.z);mine=null}}}
    else mine=null;
  }else mine=null;
  if(isTouch&&tch&&!tch.moved&&tMode==='place')mine=null;
}

// ============================================================ render
function groundUnder(x,y,z){const xi=Math.floor(x),zi=Math.floor(z);for(let yy=Math.floor(y+.1);yy>Math.floor(y)-6;yy--){if(yy<0)return 0;const id=getB(xi,yy,zi);if(id!==A&&id!==ENT_TOP&&(BL[id].solid||id===WATER||id===ENT))return yy+(id===WATER?.86:1)}return y-6}
const _hv=new THREE.Vector3();
function updCamera(){
  if(titleOpen){titleCamera();return}
  if(cine&&cine.cam!=='player'&&cineCamera())return;
  const hx=P.x,hy=P.y+1.75,hz=P.z,cp=Math.cos(camPitch),vx=-Math.sin(camYaw)*cp,vy=Math.sin(camPitch),vz=-Math.cos(camYaw)*cp;
  let dist=camDist;if(dist>0){const h=rayVox(hx,hy,hz,-vx,-vy,-vz,dist+.3);if(h)dist=Math.max(.15,h.t-.25)}
  camera.position.set(hx-vx*dist,hy-vy*dist,hz-vz*dist);_hv.set(hx+vx*10,hy+vy*10,hz+vz*10);camera.lookAt(_hv);
  playerModel.visible=dist>.7;
}
function renderFrame(dt){
  updCamera();computeAim();targetInfo();
  // player model
  const speaking=cine?cine.lines[cine.i][0]:(!$('dialog').hidden?$('dWho').textContent:'');
  playerModel.position.set(P.x,P.y,P.z);animChar(playerModel,dt,{face:P.face,ground:P.onGround,swing:P.swing>0?1-P.swing/.3:-1,lying:!!S.downed,talk:false});
  playerModel.userData.shadow.position.y=groundUnder(P.x,P.y,P.z)-P.y+.02;
  // villagers
  for(const v of S.villagers){const m=v._m;if(!m)continue;m.position.set(v.x,v.y,v.z);animChar(m,dt,{face:S.downed&&v.guide?Math.atan2(-(P.x-v.x),-(P.z-v.z)):v.face,ground:v.onGround||v.sleeping,swing:v.atk>.7?1-(v.atk-.7)/.3:-1,lying:v.sleeping||v.faint>0,talk:speaking===v.name});
    m.userData.shadow.position.y=(groundUnder(v.x,v.y,v.z)-v.y)/.9+.02;
    const r=reqOf(v);let mk='';if(v.hearts>0)mk='heart';else if(v.sleeping)mk='z';else if(v.reqState==='avail')mk='!';else if(v.reqState==='active'&&r){const p=reqProgress(v);if(p&&p[0]>=p[1])mk='ok'}
    if(mk!==v._markKey){v._markKey=mk;v._mark.visible=!!mk;if(mk)v._mark.material.map=mk==='heart'?heartTex:mk==='!'?bubbleTex('!','#e08a10'):mk==='ok'?bubbleTex('♪','#3aa860'):bubbleTex('z','#5a6ab0');v._mark.material.needsUpdate=true}
    if(mk)v._mark.position.y=2.5+Math.sin(T*3)*.08}
  // slimes
  for(const s of slimes){const m=s._m;m.position.set(s.x,s.y,s.z);animSlime(s,dt);m.children[1].position.y=groundUnder(s.x,s.y,s.z)-s.y+.02}
  // entity animations
  for(const[i,g]of entMesh){const en=ents.get(i)||{},fn=g.userData.anim;if(fn)fn(T,en);
    if(g.userData.smoke&&(en.act||en.on)&&Math.random()<dt*5&&Math.abs(g.position.x-P.x)+Math.abs(g.position.z-P.z)<30){const w=g.localToWorld(g.userData.smoke.clone());parts.push({x:w.x,y:w.y,z:w.z,vx:(Math.random()-.5)*.3,vy:.9+Math.random()*.4,vz:(Math.random()-.5)*.3,c:'#b9b9c2',life:1.6,g:-.4,smoke:1})}}
  beltMats.conveyor.map.offset.y-=dt*1.6;beltMats.conveyor2.map.offset.y-=dt*3.4;beltMats.ramp.map.offset.y-=dt*1.4/1.42;
  // belt items
  let n=0;for(const i of M){const e=ents.get(i);if(!e||!e.item||n>=MAXI)continue;const E=ENTS[e.t];if(!E.belt)continue;const[x,y,z]=XYZ(i),p=e.prog-.5;
    _v.set(x+.5+DX[e.dir]*p,y+.3+(E.ramp?e.prog:0),z+.5+DZ[e.dir]*p);_m4.compose(_v,_q.identity(),_s.set(1,1,1));beltInst.setMatrixAt(n,_m4);beltInst.setColorAt(n,colorOf(e.item));n++}
  beltInst.count=n;beltInst.instanceMatrix.needsUpdate=true;if(beltInst.instanceColor)beltInst.instanceColor.needsUpdate=true;
  // particles
  n=0;for(const p of parts){if(n>=400)break;_v.set(p.x,p.y,p.z);const k=p.smoke?.8+(1.6-p.life)*2.2:Math.max(.2,p.life*1.6);_m4.compose(_v,_q.identity(),_s.set(k,k,k));partInst.setMatrixAt(n,_m4);partInst.setColorAt(n,_c.set(p.c));n++}
  partInst.count=n;partInst.instanceMatrix.needsUpdate=true;if(partInst.instanceColor)partInst.instanceColor.needsUpdate=true;
  // selection, crack, ghost
  const h=aim.hit;selBox.visible=!!h&&!modal.kind;if(h){selBox.position.set(h.x+.5,h.y+.5,h.z+.5);const e=h.id===ENT&&ents.get(I(h.x,h.y,h.z));selBox.scale.set(1,e&&ENTS[e.t].tall?2:1,1);if(e&&ENTS[e.t].tall)selBox.position.y=h.y+1}
  crackBox.visible=!!mine&&mine.p>.02;if(mine){crackBox.position.set(mine.x+.5,mine.y+.5,mine.z+.5);crackMat.map=crackTexs[Math.min(3,Math.floor(mine.p*4))]}
  const id=S.hot[S.sel],it=id&&IT[id];ghostBox.visible=ghostArrow.visible=bpOutline.visible=false;
  if(it&&cnt(id)>0&&aim.place&&!modal.kind&&!(isTouch&&tMode==='break')){
    const[px,py,pz]=aim.place;
    if(it.bp){const d=camDir(),cells=BPS[it.bp].gen(),f=[DX[d],DZ[d]],r=[DX[(d+1)%4],DZ[(d+1)%4]];let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
      for(const c of cells){const wx=px+r[0]*c.x-f[0]*c.z,wz=pz+r[1]*c.x-f[1]*c.z;x0=Math.min(x0,wx);x1=Math.max(x1,wx);z0=Math.min(z0,wz);z1=Math.max(z1,wz)}
      bpOutline.visible=true;bpOutline.scale.set(x1-x0+1,2,z1-z0+1);bpOutline.position.set((x0+x1+1)/2,py+1,(z0+z1+1)/2)}
    else{ghostBox.visible=true;ghostBox.position.set(px+.5,py+.5,pz+.5);const E=it.ent&&ENTS[it.ent];ghostBox.scale.set(1,E&&E.tall?2:1,1);if(E&&E.tall)ghostBox.position.y=py+1;
      const ok=!(E&&E.node&&!BL[getB(px,py-1,pz)].node);ghostMat.color.setHex(ok?0x6fd08c:0xef6464);
      if(E&&(E.rot||it.ent==='door')){const d=it.ent==='door'?camDir():(camDir()+S.rot)%4;ghostArrow.visible=true;ghostArrow.position.set(px+.5+DX[d]*.75,py+.5,pz+.5+DZ[d]*.75);ghostArrow.rotation.set(0,0,0);ghostArrow.rotation.x=-Math.PI/2;ghostArrow.rotation.z=0;
        ghostArrow.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),_v.set(DX[d],0,DZ[d]))}}
  }
  updLighting(dt);
  renderer.render(scene,camera);
}

// ============================================================ main loop
let acc=0,last=performance.now(),slowT=0,saveT=60;
function update(dt){
  T+=dt;if(fade>0)fade-=dt;
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=dt*(p.g==null?14:p.g)}parts=parts.filter(p=>p.life>0);
  if(titleT>0){titleT-=dt;if(titleT<=0)$('ctitle').hidden=true}
  if(titleOpen){rebuildDirty(3);return}
  if(cine){storyTick(dt);fireworks(dt);rebuildDirty(3);for(const f of floaters){f.life-=dt;f.s.material.opacity=Math.min(1,f.life*1.5);if(f.life<=0)scene.remove(f.s)}floaters=floaters.filter(f=>f.life>0);return}
  updTime(dt);updatePlayer(dt);
  acc+=dt;while(acc>=.05){factoryTick(.05);acc-=.05}
  updVillagers(dt);updSlimes(dt);
  for(const f of floaters){f.life-=dt;f.s.position.y+=f.vy*dt;f.s.material.opacity=Math.min(1,f.life*1.5);if(f.life<=0)scene.remove(f.s)}floaters=floaters.filter(f=>f.life>0);
  rebuildDirty(3);
  if(roomsDirty)computeRooms();if(bpDirty)updateBlueprint();
  dragPlace();
  if(raidAt&&T>raidAt&&!raid){raidAt=0;startRaid('normal')}
  if(dlgT>0){dlgT-=dt;if(dlgT<=0)$('dialog').hidden=true}
  if(inspT>0){inspT-=dt;if(inspT<=0)$('insp').hidden=true}
  slowT-=dt;if(slowT<=0){slowT=.25;checkObjective();updHUD();refreshMachine(false)}
  saveT-=dt;if(saveT<=0){saveT=60;save(true)}
}
function checkObjective(){
  const o=OBJ[S.obj];if(!o||!o.ok())return;
  S.obj++;toast('목표 달성!','gold');sfx('insp');const lulu=S.villagers.find(v=>v.guide);if(lulu&&S.banner)lulu.hearts+=5;
  const nx=OBJ[S.obj];if(!nx)return;const newCh=nx.ch!==o.ch;
  const endKey={1:'c1_end'}[o.ch],written=nx.ch<=STORY_CH;
  if(endKey&&newCh){setTimeout(()=>playStory(endKey,()=>{title(`제${o.ch}장 「${CHAPTERS[o.ch]}」`,'— 끝 —',3400);sfx('level');
    if(written){setTimeout(()=>chapterTitle(nx.ch),3800);if(nx.story)setTimeout(()=>playStory(nx.story),7200)}
    else{setTimeout(()=>toast('다음 장의 이야기는 준비 중이에요. 마을과 공장 목표는 계속 이어져요!','gold'),3800);setTimeout(()=>say(LULU.name,nx.say),5400)}}),1200);return}
  const onDone=nx.story==='raid1'?()=>{raidAt=T+5}:nx.story==='c1_village'?()=>{if(!S.banner&&!(S.inv.banner>0)){give('banner',1);toast('「마을 깃발」을 받았어요','gold')}}:null,titled=newCh&&written;
  if(nx.story){if(titled){setTimeout(()=>chapterTitle(nx.ch),1000);setTimeout(()=>playStory(nx.story,onDone),4400)}else setTimeout(()=>playStory(nx.story,onDone),1000)}
  else{if(titled)setTimeout(()=>chapterTitle(nx.ch),1200);setTimeout(()=>say(LULU.name,nx.say),titled?4600:1000)}
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{update(dt);renderFrame(dt)}catch(err){console.error(err);if(!frame.err){frame.err=1;toast('오류: '+err.message,'bad')}}
  requestAnimationFrame(frame);
}
addEventListener('error',e=>{if(!frame.err2){frame.err2=1;toast('오류: '+e.message,'bad')}});
resize();
applySettings();migrateLegacy();
{const ls=latestSlot();if(!(ls&&load(ls)))newGame(false)}
renderHotbar();updHUD();showTitle();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const k in iconCache)delete iconCache[k];hotDirty=true});
addEventListener('beforeunload',()=>save(true));
requestAnimationFrame(frame);
</script>
